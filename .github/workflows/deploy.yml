# Auto-deploy BrandOS on push to main.
# Coolify (Contabo) builds the Dockerfile straight from this PUBLIC repo — no
# container registry involved — so a push only needs to trigger a Coolify deploy.
# Secrets: COOLIFY_TOKEN, COOLIFY_APP_UUID (the git-build app in
# Contabo_software / production, serving https://pm.software.thatha.net).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify (build from this repo + roll out)
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "https://app.coolify.io/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ] || { echo "Coolify deploy trigger failed"; exit 1; }
