# Build the production image, publish it to GitHub Container Registry, then
# ask Coolify (Contabo) to roll it out.
#
# The repository is private, so the server never clones it: it only pulls the
# finished image. The image holds compiled code only; every secret is set as
# an environment variable in Coolify.
#
# Needs two repository secrets for the deploy step (the build runs without them):
#   COOLIFY_TOKEN     API token from app.coolify.io → Keys & Tokens
#   COOLIFY_APP_UUID  the BrandOS application in Contabo_software / production

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: meta
        # Registry names must be lowercase; the org name is not.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/brandos" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out on Coolify
    needs: build
    runs-on: ubuntu-latest
    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      COOLIFY_URL: https://app.coolify.io
      APP_URL: https://pm.thatha.net
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$APP_UUID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COOLIFY_TOKEN / COOLIFY_APP_UUID are not set; the image was published but not deployed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin the image and deploy
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          api() { curl --fail-with-body -sS -H "Authorization: Bearer $COOLIFY_TOKEN" "$@"; }
          # An immutable tag makes every running container traceable to a commit
          # and turns a rollback into re-running an older workflow.
          api -X PATCH -H 'Content-Type: application/json' \
            -d "{\"docker_registry_image_tag\":\"${TAG}\"}" \
            "${COOLIFY_URL}/api/v1/applications/${APP_UUID}" > /dev/null
          # POST: a GET on this route answers 200 and deploys nothing.
          resp=$(api -X POST "${COOLIFY_URL}/api/v1/deploy?uuid=${APP_UUID}&force=true")
          id=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid')
          echo "deployment ${id} queued"
          for _ in $(seq 1 60); do
            status=$(api "${COOLIFY_URL}/api/v1/deployments/${id}" | jq -r '.status')
            case "$status" in
              finished) echo "finished"; exit 0 ;;
              failed|cancelled-by-user) echo "::error::deployment $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::deployment still $status after 10 minutes"; exit 1

      - name: Smoke test
        if: steps.check.outputs.configured == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${APP_URL}/api/health" || true)
            [ "$code" = 200 ] && { echo "healthy"; exit 0; }
            echo "attempt $i: $code"; sleep 10
          done
          echo "::error::app did not become healthy"; exit 1
